<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#f4f7fb"/><rect width="1920" height="100" fill="#fff"/><path d="M0 100H1920" stroke="#d4deea"/><text x="80" y="62" font-size="29" fill="#152e4d" font-weight="800" font-family="Segoe UI,Arial,sans-serif">Fragment Donor / SDK</text><text x="1040" y="61" font-size="20" fill="#52657b" font-weight="700" font-family="Segoe UI,Arial,sans-serif">RENDERED SYNTHETIC WALKTHROUGH — NOT LIVE</text><text x="80" y="184" font-size="58" fill="#152e4d" font-weight="800" font-family="Segoe UI,Arial,sans-serif">HTTP 400 does not prove funds were not sent.</text><text x="80" y="238" font-size="27" fill="#52657b" font-weight="400" font-family="Segoe UI,Arial,sans-serif">The shared fixture preserves reconciliation details without claiming confirmation.</text><rect x="80" y="290" width="1060" height="574" rx="20" fill="#142e4b" stroke="#142e4b"/><text x="118" y="344" font-size="24" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">{</text><text x="118" y="384" font-size="24" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;ok&quot;: false,</text><text x="118" y="424" font-size="24" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;unconfirmed&quot;: true,</text><text x="118" y="464" font-size="24" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;tx_hash&quot;: &quot;SYNTHETIC_UNCONFIRMED_TX_HASH&quot;,</text><text x="118" y="504" font-size="24" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;destination&quot;: &quot;SYNTHETIC_DESTINATION&quot;,</text><text x="118" y="544" font-size="24" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;amount_nano&quot;: &quot;1000000000&quot;,</text><text x="118" y="584" font-size="24" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;seqno_before&quot;: 12,</text><text x="118" y="624" font-size="24" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;info&quot;: &quot;SYNTHETIC_TRANSFER_CONFIRMATION_UNKNOWN&quot;</text><text x="118" y="664" font-size="24" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">}</text><rect x="1180" y="290" width="660" height="574" rx="20" fill="#fff1e7" stroke="#efc4a7"/><text x="1220" y="356" font-size="27" fill="#8d330d" font-weight="750" font-family="Segoe UI,Arial,sans-serif">HTTP 400 + unconfirmed: true</text><text x="1220" y="427" font-size="31" fill="#8d330d" font-weight="800" font-family="Segoe UI,Arial,sans-serif">PurchaseOutcomeUnknown</text><text x="1220" y="519" font-size="31" fill="#152e4d" font-weight="650" font-family="Segoe UI,Arial,sans-serif">Not safe rejection.</text><text x="1220" y="574" font-size="31" fill="#152e4d" font-weight="650" font-family="Segoe UI,Arial,sans-serif">Not local validation.</text><text x="1220" y="689" font-size="28" fill="#152e4d" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Keep the transaction hash.</text><text x="1220" y="749" font-size="28" fill="#8d330d" font-weight="750" font-family="Segoe UI,Arial,sans-serif">Reconcile manually. No replay.</text><rect x="0" y="935" width="1920" height="145" fill="#142e4b"/><text x="80" y="993" font-size="29" fill="#fff" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Keep tx_hash and structured error details. A purchase-status endpoint is absent.</text><text x="80" y="1046" font-size="18" fill="#b9d4f5" font-weight="700" font-family="Segoe UI,Arial,sans-serif">NO API CALLS · NO SECRET INPUT · NO REAL PAYMENT</text><text x="1730" y="1046" font-size="20" fill="#b9d4f5" font-weight="700" font-family="Segoe UI,Arial,sans-serif">04 / 05</text></svg>