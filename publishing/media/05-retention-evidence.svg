not invented telemetry</text><text x="1002" y="449" font-size="30" fill="#52657b" font-weight="400" font-family="Segoe UI,Arial,sans-serif">This viewer switches fixture text.</text><text x="1002" y="500" font-size="30" fill="#52657b" font-weight="400" font-family="Segoe UI,Arial,sans-serif">It sends zero SDK requests.</text><text x="1002" y="609" font-size="30" fill="#152e4d" font-weight="650" font-family="Segoe UI,Arial,sans-serif">Native mock tests check no duplicates.</text><text x="1002" y="660" font-size="29" fill="#52657b" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Inspect source and CI for actual results.</text><text x="1002" y="771" font-size="27" fill="#1857a5" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Independent / not official / no guarantees</text><rect x="0" y="935" width="1920" height="145" fill="#142e4b"/><text x="80" y="993" font-size="29" fill="#fff" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Use server-side secret storage. Synthetic media is not payment evidence.</text><text x="80" y="1046" font-size="18" fill="#b9d4f5" font-weight="700" font-family="Segoe UI,Arial,sans-serif">NO API CALLS · NO SECRET INPUT · NO REAL PAYMENT</text><text x="1730" y="1046" font-size="20" fill="#b9d4f5" font-weight="700" font-family="Segoe UI,Arial,sans-serif">05 / 05</text></svg>