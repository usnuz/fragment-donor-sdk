<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#f4f7fb"/><rect width="1920" height="100" fill="#fff"/><path d="M0 100H1920" stroke="#d4deea"/><text x="80" y="62" font-size="29" fill="#152e4d" font-weight="800" font-family="Segoe UI,Arial,sans-serif">Fragment Donor / SDK</text><text x="1040" y="61" font-size="20" fill="#52657b" font-weight="700" font-family="Segoe UI,Arial,sans-serif">RENDERED SYNTHETIC WALKTHROUGH — NOT LIVE</text><text x="80" y="184" font-size="58" fill="#152e4d" font-weight="800" font-family="Segoe UI,Arial,sans-serif">Wait hints are not replay permission.</text><text x="80" y="238" font-size="27" fill="#52657b" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Synthetic limiter responses preserve HTTP and JSON retry hints.</text><rect x="80" y="290" width="840" height="574" rx="20" fill="#fff" stroke="#d4deea"/><text x="120" y="356" font-size="34" fill="#804a00" font-weight="750" font-family="Segoe UI,Arial,sans-serif">429 / FLOOD_WAIT / 42s</text><rect x="115" y="394" width="770" height="308" rx="20" fill="#142e4b" stroke="#142e4b"/><text x="147" y="438" font-size="25" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">{</text><text x="147" y="478" font-size="25" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;ok&quot;: false,</text><text x="147" y="518" font-size="25" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;error&quot;: &quot;Too many requests&quot;,</text><text x="147" y="558" font-size="25" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;error_code&quot;: &quot;FLOOD_WAIT&quot;,</text><text x="147" y="598" font-size="25" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;retry_after&quot;: 42,</text><text x="147" y="638" font-size="25" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">  &quot;flood_wait&quot;: 42</text><text x="147" y="678" font-size="25" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">}</text><text x="120" y="755" font-size="27" fill="#804a00" font-weight="750" font-family="Segoe UI,Arial,sans-serif">503 / RATE_LIMIT_UNAVAILABLE / 5s</text><text x="120" y="815" font-size="27" fill="#52657b" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Do not bypass a missing safety limiter.</text><rect x="960" y="290" width="880" height="574" rx="20" fill="#ecf8f1" stroke="#b7d9c8"/><text x="1002" y="358" font-size="34" fill="#0c694a" font-weight="750" font-family="Segoe UI,Arial,sans-serif">Read-only retries</text><text x="1002" y="421" font-size="29" fill="#152e4d" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Default: 0</text><text x="1002" y="482" font-size="29" fill="#152e4d" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Opt-in maximum: 2</text><text x="1002" y="543" font-size="29" fill="#152e4d" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Maximum automatic wait: 60 seconds</text><text x="1002" y="671" font-size="39" fill="#8d330d" font-weight="800" font-family="Segoe UI,Arial,sans-serif">Purchases: NEVER auto-replay</text><text x="1002" y="733" font-size="27" fill="#52657b" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Including 429, 503, timeout and 5xx.</text><rect x="0" y="935" width="1920" height="145" fill="#142e4b"/><text x="80" y="993" font-size="29" fill="#fff" font-weight="600" font-family="Segoe UI,Arial,sans-serif">429 and 503 expose wait hints; the purchase retry rule stays NEVER.</text><text x="80" y="1046" font-size="18" fill="#b9d4f5" font-weight="700" font-family="Segoe UI,Arial,sans-serif">NO API CALLS · NO SECRET INPUT · NO REAL PAYMENT</text><text x="1730" y="1046" font-size="20" fill="#b9d4f5" font-weight="700" font-family="Segoe UI,Arial,sans-serif">03 / 05</text></svg>