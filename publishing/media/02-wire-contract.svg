<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#f4f7fb"/><rect width="1920" height="100" fill="#fff"/><path d="M0 100H1920" stroke="#d4deea"/><text x="80" y="62" font-size="29" fill="#152e4d" font-weight="800" font-family="Segoe UI,Arial,sans-serif">Fragment Donor / SDK</text><text x="1040" y="61" font-size="20" fill="#52657b" font-weight="700" font-family="Segoe UI,Arial,sans-serif">RENDERED SYNTHETIC WALKTHROUGH — NOT LIVE</text><text x="80" y="184" font-size="58" fill="#152e4d" font-weight="800" font-family="Segoe UI,Arial,sans-serif">An open API, not an open wallet.</text><text x="80" y="238" font-size="27" fill="#52657b" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Purchase parameters use application/x-www-form-urlencoded.</text><rect x="80" y="290" width="1100" height="574" rx="20" fill="#142e4b" stroke="#142e4b"/><text x="118" y="351" font-size="26" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">POST /buy-stars/</text><text x="118" y="391" font-size="26" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">Mnemonic: [YOUR SERVER-SIDE WALLET SECRET]</text><text x="118" y="431" font-size="26" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">Cookie: [YOUR FRAGMENT SESSION]</text><text x="118" y="471" font-size="26" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">Api-Key: [OPTIONAL TONCONSOLE PROVIDER KEY]</text><text x="118" y="511" font-size="26" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">Content-Type: application/x-www-form-urlencoded</text><text x="118" y="551" font-size="26" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve"></text><text x="118" y="591" font-size="26" fill="#eaf3ff" font-family="Consolas,monospace" xml:space="preserve">username=durov&amp;amount=50&amp;payment_method=usdt_ton</text><rect x="1220" y="290" width="620" height="574" rx="20" fill="#fff" stroke="#d4deea"/><text x="1260" y="355" font-size="33" fill="#152e4d" font-weight="750" font-family="Segoe UI,Arial,sans-serif">No service API key</text><text x="1260" y="406" font-size="24" fill="#52657b" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Direct API: no service login</text><text x="1260" y="498" font-size="27" fill="#152e4d" font-weight="650" font-family="Segoe UI,Arial,sans-serif">Mnemonic + Cookie are</text><text x="1260" y="542" font-size="27" fill="#152e4d" font-weight="650" font-family="Segoe UI,Arial,sans-serif">wallet / Fragment credentials.</text><text x="1260" y="641" font-size="27" fill="#152e4d" font-weight="650" font-family="Segoe UI,Arial,sans-serif">Optional Api-Key:</text><text x="1260" y="685" font-size="27" fill="#52657b" font-weight="400" font-family="Segoe UI,Arial,sans-serif">TonConsole provider only.</text><text x="1260" y="788" font-size="27" fill="#1857a5" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Form encoded, never JSON.</text><rect x="0" y="935" width="1920" height="145" fill="#142e4b"/><text x="80" y="993" font-size="29" fill="#fff" font-weight="600" font-family="Segoe UI,Arial,sans-serif">Wallet secrets stay server-side; Api-Key is an optional provider key.</text><text x="80" y="1046" font-size="18" fill="#b9d4f5" font-weight="700" font-family="Segoe UI,Arial,sans-serif">NO API CALLS · NO SECRET INPUT · NO REAL PAYMENT</text><text x="1730" y="1046" font-size="20" fill="#b9d4f5" font-weight="700" font-family="Segoe UI,Arial,sans-serif">02 / 05</text></svg>