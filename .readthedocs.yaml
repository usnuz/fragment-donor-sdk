version: 2

build:
  os: ubuntu-24.04
  tools:
    nodejs: "20"
  jobs:
    build:
      html:
        - DOCS_BASE_URL="https://usnuz.github.io/fragment-donor-sdk/" DOCS_NOINDEX=1 node docs/build.mjs
        - DOCS_BASE_URL="https://usnuz.github.io/fragment-donor-sdk/" DOCS_NOINDEX=1 node docs/test.mjs
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -R site/. "$READTHEDOCS_OUTPUT/html/"
