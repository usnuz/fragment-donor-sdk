[package]
name = "fragment-donor-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Independent server-side no-service-auth Fragment Donor API SDK"
license = "MIT"
repository = "https://github.com/usnuz/fragment-donor-sdk"
homepage = "https://usnuz.github.io/fragment-donor-sdk/"
documentation = "https://usnuz.github.io/fragment-donor-sdk/"
readme = "README.md"
keywords = ["telegram", "stars", "premium", "fragment", "ton"]
categories = ["api-bindings"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
httpdate = "1"
percent-encoding = "2.3"
